# Application identity
spring.application.name=Perfume Advisor Backend

# Version exposed by the /api/v1/ping endpoint.
# Maven resource filtering replaces @project.version@ at build time.
app.version=@project.version@

# --- Database (configured via environment variables) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate — validate schema against Flyway-managed DDL, never auto-generate
spring.jpa.hibernate.ddl-auto=validate

# Flyway — enabled by default via the starter; migrations live in db/migration
spring.flyway.enabled=true
